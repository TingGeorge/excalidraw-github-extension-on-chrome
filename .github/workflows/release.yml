name: Release

# Publishes a GitHub release with the packaged extension attached, either when
# a tag like v1.2.3 (matching package.json "version") is pushed, or on demand
# from the Actions tab ("Run workflow" on main), which creates the tag itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Determine the release tag
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run package
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" release/*.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes
